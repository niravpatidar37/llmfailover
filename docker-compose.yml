# Local stack for llmfailover (the self-healing LLM gateway). Every port is bound to 127.0.0.1 only.
#   docker compose -p p3-gateway up -d                 # redis, prometheus, grafana, ollama-cpu
#   docker compose -p p3-gateway --profile app up -d   # + gateway and chaos proxy containers
# CI smoke stack (fake LLM, no model runtimes): add -f deploy/compose.smoke.yml (see .github/workflows/ci.yml).
# Third-party images are pinned by digest (tag kept for readability; Dependabot bumps both).
name: p3-gateway

services:
  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports: ["127.0.0.1:16380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama-cpu:
    # Second, independent model runtime (CPU, qwen2.5:0.5b): a separate failure domain from host GPU Ollama.
    image: ollama/ollama:0.40.5@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
    ports: ["127.0.0.1:11435:11434"]
    environment:
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes: ["ollama-cpu-models:/root/.ollama"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    ports: ["127.0.0.1:13001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init_env.py to create .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

  migrate:
    # Versioned Redis keyspace migrations (one-shot); the gateway's /readyz stays 503 until they ran.
    profiles: ["app"]
    build: .
    image: llmfailover:local
    command: ["python", "-m", "gateway.migrate"]
    environment:
      ENV: dev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    restart: "no"

  gateway:
    profiles: ["app"]
    build: .
    image: llmfailover:local
    env_file:
      - path: .env
        required: true
      - path: ${PORTFOLIO_ENV_FILE:-F:/.secrets/portfolio.env}
        required: false
    environment:
      ENV: dev
      GATEWAY_CONFIG: /app/config/gateway.yaml
      GATEWAY_PORT: "8103"
      GATEWAY_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_CPU_URL: http://ollama-cpu:11434
      LLM_SPEND_LEDGER: /ledger/ledger.jsonl
    volumes: ["${LLM_SPEND_DIR:-F:/.llm-spend}:/ledger"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8103:8103"]
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  chaos:
    profiles: ["app"]
    image: llmfailover:local
    command: ["python", "-m", "gateway.chaos"]
    env_file:
      - path: .env
        required: true
    environment:
      ENV: dev
      CHAOS_ENABLED: "1"
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_CPU_URL: http://ollama-cpu:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8113:8113"]

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  ollama-cpu-models:
