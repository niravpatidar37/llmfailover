name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.21"
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  lint-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Real Redis 7 for the multi-instance tests (Lua breaker transitions, shared limits, two processes).
      redis:
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen
      # Tests use fakeredis, a real Redis service and a scripted fake provider: no secrets, no LLM calls.
      - run: uv run pytest -q -rs

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen
      - name: bandit
        run: uv run bandit -q -r src -c pyproject.toml
      - name: pip-audit (runtime deps, hash-pinned from uv.lock)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit -r "$RUNNER_TEMP/req.txt" --disable-pip --require-hashes
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --no-banner -v

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build image
        run: docker build -t llmfailover:ci .
      - name: image refuses to start with chaos enabled in prod (image default ENV=prod)
        run: |
          set +e
          out=$(docker run --rm -e CHAOS_ENABLED=1 -e GROQ_API_KEY=x llmfailover:ci 2>&1)
          code=$?
          set -e
          echo "$out" | tail -3
          test "$code" -ne 0
          echo "$out" | grep -q "CHAOS_ENABLED=1 is refused when ENV=prod"
          set +e
          tok="$(openssl rand -hex 16)"
          out=$(docker run --rm -e CHAOS_ENABLED=1 -e CHAOS_ADMIN_TOKEN="$tok" \
            llmfailover:ci python -m gateway.chaos 2>&1)
          code=$?
          set -e
          test "$code" -ne 0
          echo "$out" | grep -q "chaos proxy never runs when ENV=prod"
      - name: container runs as non-root; /healthz is up; /readyz needs the migration
        run: |
          docker network create gwci
          docker run -d --name redis --network gwci redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          docker run -d --name gw --network gwci -e ENV=dev -e GATEWAY_CONFIG=/app/config/gateway.yaml \
            -e REDIS_URL=redis://redis:6379/0 -e LLM_SPEND_LEDGER=/tmp/ledger.jsonl llmfailover:ci
          probe() { docker exec gw python -c "import sys,urllib.request,urllib.error
          try: print(urllib.request.urlopen('http://127.0.0.1:8103$1', timeout=3).status)
          except urllib.error.HTTPError as e: print(e.code)"; }
          for i in $(seq 1 30); do
            if [ "$(probe /healthz 2>/dev/null)" = "200" ]; then break; fi
            sleep 2
          done
          test "$(docker exec gw id -u)" = "10001"
          test "$(probe /healthz)" = "200"
          test "$(probe /readyz)" = "503"
          docker run --rm --network gwci -e ENV=dev -e REDIS_URL=redis://redis:6379/0 \
            llmfailover:ci python -m gateway.migrate
          test "$(probe /readyz)" = "200"
          docker logs gw 2>&1 | tail -5
      - name: trivy image scan (HIGH/CRITICAL, fixed)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          llmfailover:ci
      - name: SBOM (CycloneDX) of the image
        run: |
          mkdir -p "$RUNNER_TEMP/sbom" && chmod 777 "$RUNNER_TEMP/sbom"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/sbom:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --format cyclonedx --output /out/llmfailover-sbom.cdx.json --no-progress llmfailover:ci
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['bomFormat']=='CycloneDX'; print(d['specVersion'], len(d.get('components', [])), 'components')" \
            "$RUNNER_TEMP/sbom/llmfailover-sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom/llmfailover-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  smoke:
    # Full compose stack (redis, migrate, gateway, prometheus, grafana) with the deterministic fake LLM,
    # then the same scripts/smoke.py the deploy workflow runs after staging and the prod canary. No secrets:
    # scripts/init_env.py generates throwaway admin/Grafana tokens for this run only.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -p p3-smoke -f docker-compose.yml -f deploy/compose.smoke.yml --profile app
      LLM_SPEND_DIR: /tmp/llm-spend # local ledger mount (the fake providers are free; nothing is spent)
      PORTFOLIO_ENV_FILE: /nonexistent/portfolio.env # no provider secrets in CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build image
        run: docker build -t llmfailover:local .
      - name: fake LLM mode and chaos are refused in prod (image default ENV=prod) and staging
        run: |
          set +e
          out=$(docker run --rm -e FAKE_LLM=1 -e GROQ_API_KEY=x llmfailover:local 2>&1); code=$?
          set -e
          echo "$out" | tail -2
          test "$code" -ne 0 && echo "$out" | grep -q "FAKE_LLM=1 is refused when ENV=prod"
          set +e
          out=$(docker run --rm -e ENV=staging -e FAKE_LLM=1 -e GROQ_API_KEY=x llmfailover:local 2>&1); code=$?
          set -e
          test "$code" -ne 0 && echo "$out" | grep -q "FAKE_LLM=1 is refused when ENV=staging"
          set +e
          out=$(docker run --rm -e CHAOS_ENABLED=1 -e GROQ_API_KEY=x llmfailover:local 2>&1); code=$?
          set -e
          test "$code" -ne 0 && echo "$out" | grep -q "CHAOS_ENABLED=1 is refused when ENV=prod"
      - name: bring up the compose stack (fake LLM)
        run: |
          python3 scripts/init_env.py
          mkdir -p "$LLM_SPEND_DIR" && chmod 777 "$LLM_SPEND_DIR"
          $COMPOSE up -d --no-build gateway prometheus grafana
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8103/readyz || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          $COMPOSE ps
      - name: smoke suite (scripts/smoke.py)
        run: |
          SMOKE_ADMIN_TOKEN="$(grep '^GATEWAY_ADMIN_TOKEN=' .env | cut -d= -f2-)"
          echo "::add-mask::$SMOKE_ADMIN_TOKEN"
          export SMOKE_ADMIN_TOKEN
          python3 scripts/smoke.py --base-url http://127.0.0.1:8103 --expect-env dev \
            --allow-disruptive --require-functional --wait-ready 60 --json-out smoke-summary.json
      - name: Prometheus scraped the breaker gauges from the gateway container
        run: |
          for i in $(seq 1 20); do
            n=$(curl -s 'http://127.0.0.1:19090/api/v1/query?query=gateway_circuit_state' \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)['data']['result']))")
            [ "$n" -ge 1 ] && { echo "prometheus has $n gateway_circuit_state series"; exit 0; }
            sleep 3
          done
          echo "::error::prometheus never scraped gateway_circuit_state"; exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: smoke-summary
          path: smoke-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: compose logs (on failure)
        if: ${{ failure() }}
        run: $COMPOSE logs --no-color --tail 300
      - name: tear down
        if: ${{ always() }}
        run: $COMPOSE down -v --remove-orphans

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform init (no backend) + validate
        run: |
          for d in envs/staging envs/prod modules/gateway; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false -lockfile=readonly 2>/dev/null \
              || terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint (terraform + google rulesets)
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit only; read-only token
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          for d in envs/staging envs/prod modules/gateway; do
            tflint --chdir="$d" --config "$PWD/.tflint.hcl"
          done
      - name: checkov (IaC scan; skips are justified inline)
        run: >
          docker run --rm -v "$PWD:/tf"
          bridgecrew/checkov:3.3.29@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3
          -d /tf --framework terraform --compact --quiet
